[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fastorganize"
version = "0.1.0"
description = "AST-powered CLI for safely organizing FastAPI projects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "typer>=0.12.0",
]

[project.scripts]
fastorganize = "fastorganize.cli:app"

[tool.setuptools.packages.find]
include = ["fastorganize*"]